<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feliz Primavera 💛</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  font-family:Georgia,"Times New Roman",serif;
  color:#5d4300;
}

button{
  border:0;
  background:none;
  font:inherit;
}

.screen{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
}

.hidden{
  display:none !important;
}

/* PANTALLA INICIAL */

#intro{
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(
      circle at 50% 38%,
      #fffdf4 0%,
      #fff4bd 55%,
      #f5df8b 100%
    );
}

#start{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:18px;
  cursor:pointer;
  animation:flotar 2.2s ease-in-out infinite;
}

.hero-flower{
  font-size:120px;
  line-height:1;
  filter:drop-shadow(0 10px 15px rgba(100,70,0,.15));
}

.start-text{
  font-family:Arial,sans-serif;
  font-size:22px;
  font-weight:bold;
  color:#7d5900;
  background:rgba(255,255,255,.55);
  padding:10px 20px;
  border-radius:30px;
}

@keyframes flotar{
  0%,100%{
    transform:translateY(0);
  }
  50%{
    transform:translateY(-10px);
  }
}

/* PAISAJE */

#scene{
  background:
    linear-gradient(
      #fffef8 0%,
      #fff2b9 54%,
      #cbe9a2 54%,
      #91c45f 100%
    );
}

.sun{
  position:absolute;
  right:8%;
  top:7%;
  width:80px;
  height:80px;
  border-radius:50%;
  background:#ffd23b;
  box-shadow:
    0 0 0 15px rgba(255,210,59,.17),
    0 0 45px rgba(255,200,50,.45);
}

.cloud{
  position:absolute;
  background:rgba(255,255,255,.9);
  border-radius:100px;
}

.cloud:before,
.cloud:after{
  content:"";
  position:absolute;
  background:inherit;
  border-radius:50%;
}

.c1{
  left:8%;
  top:11%;
  width:105px;
  height:32px;
}

.c1:before{
  width:45px;
  height:45px;
  left:13px;
  top:-18px;
}

.c1:after{
  width:58px;
  height:58px;
  left:44px;
  top:-26px;
}

.c2{
  left:51%;
  top:18%;
  width:115px;
  height:34px;
}

.c2:before{
  width:46px;
  height:46px;
  left:18px;
  top:-18px;
}

.c2:after{
  width:60px;
  height:60px;
  left:48px;
  top:-26px;
}

/* COLINAS */

.hill-back{
  position:absolute;
  left:-15%;
  right:-15%;
  bottom:18%;
  height:32%;
  background:#b7dc87;
  border-radius:50% 50% 0 0 / 100% 100% 0 0;
}

.hill-front{
  position:absolute;
  left:-18%;
  right:-18%;
  bottom:-17%;
  height:46%;
  background:#82b956;
  border-radius:50% 50% 0 0 / 100% 100% 0 0;
}

/* JARDÍN */

.garden{
  position:absolute;
  left:0;
  right:0;
  pointer-events:none;
}

#gardenBack{
  bottom:24%;
  height:30%;
  z-index:2;
}

#gardenFront{
  bottom:3%;
  height:36%;
  z-index:5;
}

.plant{
  position:absolute;
  bottom:0;
  width:78px;
  height:190px;
  transform:translateX(-50%);
}

.plant.back{
  width:65px;
  height:155px;
}

.stem{
  position:absolute;
  left:50%;
  bottom:0;

  width:8px;
  height:115px;

  border-radius:20px;
  background:linear-gradient(#4d861f,#78ad37);

  transform:
    translateX(-50%)
    scaleY(0);

  transform-origin:bottom;

  animation:
    crecerTallo .55s ease-out forwards;
}

.back .stem{
  height:90px;
  width:7px;
}

.leaf{
  position:absolute;

  width:32px;
  height:17px;

  background:#5f9f2f;

  border-radius:
    100% 0 100% 0;

  opacity:0;
}

.leaf.left{
  left:8px;
  bottom:45px;
}

.leaf.right{
  right:8px;
  bottom:65px;
}

.flower{
  position:absolute;
  left:50%;
  bottom:98px;

  font-size:60px;
  line-height:1;

  opacity:0;

  transform:
    translateX(-50%)
    scale(.1);

  filter:
    drop-shadow(
      0 5px 5px
      rgba(70,50,0,.15)
    );
}

.back .flower{
  bottom:76px;
  font-size:49px;
}

@keyframes crecerTallo{
  to{
    transform:
      translateX(-50%)
      scaleY(1);
  }
}

@keyframes hojaIzquierda{
  from{
    opacity:0;
    transform:
      translateY(8px)
      rotate(-28deg);
  }

  to{
    opacity:1;
    transform:
      translateY(0)
      rotate(-28deg);
  }
}

@keyframes hojaDerecha{
  from{
    opacity:0;
    transform:
      translateY(8px)
      scaleX(-1)
      rotate(-28deg);
  }

  to{
    opacity:1;
    transform:
      translateY(0)
      scaleX(-1)
      rotate(-28deg);
  }
}

@keyframes florecer{
  0%{
    opacity:0;
    transform:
      translateX(-50%)
      scale(.1)
      rotate(-20deg);
  }

  70%{
    opacity:1;
    transform:
      translateX(-50%)
      scale(1.15)
      rotate(5deg);
  }

  100%{
    opacity:1;
    transform:
      translateX(-50%)
      scale(1);
  }
}

/* MENSAJE */

.card-wrap{
  position:absolute;

  left:50%;
  top:24%;

  transform:
    translateX(-50%);

  width:min(92vw,680px);

  z-index:4;
}

.card{
  width:100%;

  text-align:center;

  padding:
    18px 20px;

  background:
    rgba(255,255,255,.86);

  border:
    2px solid
    rgba(236,197,49,.5);

  border-radius:22px;

  box-shadow:
    0 14px 38px
    rgba(85,62,0,.13);

  opacity:0;

  transform:
    translateY(15px)
    scale(.96);

  transition:
    opacity 1.1s ease,
    transform 1.1s ease;
}

.card.show{
  opacity:1;

  transform:
    translateY(0)
    scale(1);
}

.card p{
  margin:
    0 0 10px;

  font-size:
    clamp(
      17px,
      4.2vw,
      25px
    );

  line-height:1.3;
}

.card h1{
  margin:0;

  font-size:
    clamp(
      25px,
      6vw,
      38px
    );

  color:#a06c00;
}

.card h2{
  margin:
    7px 0 0;

  font-size:
    clamp(
      20px,
      5vw,
      29px
    );

  color:#715100;
}

/* CELULAR */

@media(max-width:520px){

  .hero-flower{
    font-size:100px;
  }

  .sun{
    width:65px;
    height:65px;
  }

  .card-wrap{
    top:23%;
  }

  .card{
    padding:
      14px 13px;
  }

  .plant{
    width:72px;
    height:175px;
  }

  .plant.back{
    width:60px;
    height:148px;
  }

  .stem{
    height:104px;
  }

  .back .stem{
    height:86px;
  }

  .flower{
    font-size:54px;
    bottom:91px;
  }

  .back .flower{
    font-size:45px;
    bottom:72px;
  }
}

</style>
</head>

<body>

<section
  id="intro"
  class="screen"
>

  <button
    id="start"
    type="button"
  >

    <div class="hero-flower">
      🌻
    </div>

    <div class="start-text">
      Haz click aquí
    </div>

  </button>

</section>


<section
  id="scene"
  class="screen hidden"
>

  <div class="sun"></div>

  <div class="cloud c1"></div>

  <div class="cloud c2"></div>


  <div class="hill-back"></div>


  <div
    id="gardenBack"
    class="garden">
  </div>


  <div class="card-wrap">

    <div
      id="card"
      class="card">

      <p>
        Dicen que las flores amarillas
        son para prometer amor eterno,
        entonces recordé que yo quiero
        estar contigo siempre.
      </p>

      <h1>
        Te amo pollito💛
      </h1>

      <h2>
        Feliz Primavera
      </h2>

    </div>

  </div>


  <div class="hill-front"></div>


  <div
    id="gardenFront"
    class="garden">
  </div>

</section>


<script>

const start =
  document.getElementById("start");

const intro =
  document.getElementById("intro");

const scene =
  document.getElementById("scene");

const card =
  document.getElementById("card");

const gardenBack =
  document.getElementById("gardenBack");

const gardenFront =
  document.getElementById("gardenFront");


function crearGirasol(
  x,
  delay,
  back = false
){

  const plant =
    document.createElement("div");

  plant.className =
    "plant" +
    (back ? " back" : "");

  plant.style.left =
    x + "%";


  const stem =
    document.createElement("div");

  stem.className =
    "stem";

  stem.style.animationDelay =
    delay + "ms";


  const leaf1 =
    document.createElement("div");

  leaf1.className =
    "leaf left";

  leaf1.style.animation =
    `hojaIzquierda
     .35s ease-out
     ${delay + 160}ms
     forwards`;


  const leaf2 =
    document.createElement("div");

  leaf2.className =
    "leaf right";

  leaf2.style.animation =
    `hojaDerecha
     .35s ease-out
     ${delay + 230}ms
     forwards`;


  const flower =
    document.createElement("div");

  flower.className =
    "flower";

  flower.textContent =
    "🌻";

  flower.style.animation =
    `florecer
     .5s
     cubic-bezier(.2,.8,.2,1)
     ${delay + 350}ms
     forwards`;


  plant.append(
    stem,
    leaf1,
    leaf2,
    flower
  );

  return plant;
}


function crearJardin(){

  gardenBack.innerHTML = "";

  gardenFront.innerHTML = "";


  const filaAtras = [
    3,10,17,24,31,38,45,
    52,59,66,73,80,87,94,99
  ];


  const filaDelante = [
    2,7,12,17,22,27,
    32,37,42,47,52,
    57,62,67,72,77,
    82,87,92,97
  ];


  let delay = 0;


  filaAtras.forEach(
    x => {

      gardenBack.appendChild(
        crearGirasol(
          x,
          delay,
          true
        )
      );

      delay += 75;

    }
  );


  filaDelante.forEach(
    x => {

      gardenFront.appendChild(
        crearGirasol(
          x,
          delay,
          false
        )
      );

      delay += 70;

    }
  );


  setTimeout(
    () => {
      card.classList.add("show");
    },
    delay + 450
  );

}


start.addEventListener(
  "click",
  () => {

    intro.classList.add(
      "hidden"
    );

    scene.classList.remove(
      "hidden"
    );

    card.classList.remove(
      "show"
    );

    crearJardin();

  }
);

</script>

</body>
</html>
