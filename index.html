<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feliz Primavera 💛</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Georgia,"Times New Roman",serif;background:#fff7d1;color:#5d4300}
button{font:inherit;border:0;background:none}
.screen{position:fixed;inset:0;width:100%;height:100%}
.hidden{display:none!important}

/* Pantalla inicial */
#intro{
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 38%,#fffdf4 0 25%,#fff4bd 58%,#f5df8b 100%);
}
#start{
  display:flex;flex-direction:column;align-items:center;gap:18px;
  cursor:pointer;animation:float 2.2s ease-in-out infinite;
}
.hero-flower{font-size:112px;line-height:1;filter:drop-shadow(0 12px 16px rgba(100,70,0,.16))}
.start-text{
  font-family:Arial,sans-serif;font-size:22px;font-weight:700;color:#7d5900;
  background:rgba(255,255,255,.5);padding:9px 18px;border-radius:999px;
  box-shadow:0 7px 22px rgba(95,70,0,.11)
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}

/* Escena */
#scene{
  background:linear-gradient(#fffef8 0%,#fff2b9 53%,#cae9a1 53%,#90c35e 100%);
}
.sun{
  position:absolute;right:8%;top:7%;width:78px;height:78px;border-radius:50%;
  background:#ffd23b;box-shadow:0 0 0 15px rgba(255,210,59,.17),0 0 42px rgba(255,200,50,.45)
}
.cloud{position:absolute;background:rgba(255,255,255,.88);border-radius:999px}
.cloud:before,.cloud:after{content:"";position:absolute;background:inherit;border-radius:50%}
.c1{left:8%;top:11%;width:105px;height:32px}
.c1:before{width:45px;height:45px;left:13px;top:-18px}
.c1:after{width:58px;height:58px;left:44px;top:-26px}
.c2{left:50%;top:20%;width:115px;height:34px}
.c2:before{width:46px;height:46px;left:18px;top:-18px}
.c2:after{width:60px;height:60px;left:48px;top:-26px}

.hill.back{
  position:absolute;left:-10%;right:-10%;bottom:19%;height:30%;
  background:#b8dc88;border-radius:50% 50% 0 0/100% 100% 0 0;
}
.hill.front{
  position:absolute;left:-14%;right:-14%;bottom:-15%;height:43%;
  background:#83b958;border-radius:50% 50% 0 0/100% 100% 0 0;
}

.garden{position:absolute;left:0;right:0;pointer-events:none}
#gardenBack{bottom:25%;height:28%;z-index:2}
#gardenFront{bottom:5%;height:34%;z-index:5}

.plant{
  position:absolute;bottom:0;width:64px;height:170px;transform:translateX(-50%);
}
.plant.back{width:52px;height:140px}
.stem{
  position:absolute;left:50%;bottom:0;width:7px;height:105px;border-radius:99px;
  background:linear-gradient(#4d861f,#78ad37);
  transform:translateX(-50%) scaleY(0);transform-origin:bottom;
  animation:stemGrow .55s ease-out forwards
}
.back .stem{height:84px;width:6px}
.leaf{
  position:absolute;width:28px;height:15px;background:#5f9f2f;
  border-radius:100% 0 100% 0;opacity:0
}
.leaf.l{left:8px;bottom:41px;transform:rotate(-27deg)}
.leaf.r{right:8px;bottom:58px;transform:scaleX(-1) rotate(-27deg)}
.back .leaf.l{bottom:34px}.back .leaf.r{bottom:47px}
.head{
  position:absolute;left:50%;bottom:91px;transform:translateX(-50%) scale(.1);
  font-size:48px;line-height:1;opacity:0;transform-origin:center;
  filter:drop-shadow(0 5px 5px rgba(70,50,0,.12))
}
.back .head{font-size:39px;bottom:72px}
@keyframes stemGrow{to{transform:translateX(-50%) scaleY(1)}}
@keyframes leafIn{from{opacity:0;transform:translateY(6px) rotate(-27deg)}to{opacity:1;transform:translateY(0) rotate(-27deg)}}
@keyframes leafInR{from{opacity:0;transform:translateY(6px) scaleX(-1) rotate(-27deg)}to{opacity:1;transform:translateY(0) scaleX(-1) rotate(-27deg)}}
@keyframes bloom{0%{opacity:0;transform:translateX(-50%) scale(.1) rotate(-20deg)}70%{opacity:1;transform:translateX(-50%) scale(1.15) rotate(4deg)}100%{opacity:1;transform:translateX(-50%) scale(1)}}

.card-wrap{
  position:absolute;left:50%;top:27%;transform:translateX(-50%);
  width:min(92vw,680px);z-index:4;pointer-events:none
}
.card{
  opacity:0;transform:translateY(15px) scale(.96);
  width:100%;padding:18px 20px;text-align:center;
  background:rgba(255,255,255,.84);
  border:2px solid rgba(236,197,49,.5);border-radius:22px;
  box-shadow:0 14px 38px rgba(85,62,0,.13);
  transition:opacity 1.1s ease,transform 1.1s ease
}
.card.show{opacity:1;transform:translateY(0) scale(1)}
.card p{margin:0 0 10px;font-size:clamp(17px,4.2vw,25px);line-height:1.3}
.card h1{margin:0;font-size:clamp(25px,6vw,38px);color:#a06c00}
.card h2{margin:7px 0 0;font-size:clamp(20px,5vw,29px);color:#715100}

@media(max-width:520px){
  .hero-flower{font-size:96px}
  .sun{width:66px;height:66px}
  .card-wrap{top:25%}
  .card{padding:15px 13px}
  .plant{width:58px;height:155px}
  .stem{height:96px}
  .head{bottom:83px;font-size:44px}
}
</style>
</head>
<body>

<section id="intro" class="screen">
  <button id="start" type="button">
    <div class="hero-flower">🌻</div>
    <div class="start-text">Haz click aquí</div>
  </button>
</section>

<section id="scene" class="screen hidden" aria-hidden="true">
  <div class="sun"></div>
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>

  <div class="hill back"></div>
  <div id="gardenBack" class="garden"></div>

  <div class="card-wrap">
    <div id="card" class="card">
      <p>Dicen que las flores amarillas son para prometer amor eterno, entonces recordé que yo quiero estar contigo siempre.</p>
      <h1>Te amo pollito💛</h1>
      <h2>Feliz Primavera</h2>
    </div>
  </div>

  <div class="hill front"></div>
  <div id="gardenFront" class="garden"></div>
</section>

<script>
const start = document.getElementById("start");
const intro = document.getElementById("intro");
const scene = document.getElementById("scene");
const card = document.getElementById("card");
const gardenBack = document.getElementById("gardenBack");
const gardenFront = document.getElementById("gardenFront");

function plantHTML(x, delay, back=false){
  const p = document.createElement("div");
  p.className = "plant" + (back ? " back" : "");
  p.style.left = x + "%";

  const stem = document.createElement("div");
  stem.className = "stem";
  stem.style.animationDelay = delay + "ms";

  const l = document.createElement("div");
  l.className = "leaf l";
  l.style.animation = `leafIn .35s ease-out ${delay+160}ms forwards`;

  const r = document.createElement("div");
  r.className = "leaf r";
  r.style.animation = `leafInR .35s ease-out ${delay+230}ms forwards`;

  const head = document.createElement("div");
  head.className = "head";
  head.textContent = "🌻";
  head.style.animation = `bloom .5s cubic-bezier(.2,.8,.2,1) ${delay+360}ms forwards`;

  p.append(stem,l,r,head);
  return p;
}

function buildGarden(){
  gardenBack.innerHTML = "";
  gardenFront.innerHTML = "";

  const backXs = [8,18,28,38,48,58,68,78,88,96];
  const frontXs = [4,12,20,28,36,44,52,60,68,76,84,92,98];

  let delay = 0;

  backXs.forEach(x=>{
    gardenBack.appendChild(plantHTML(x,delay,true));
    delay += 100;
  });

  frontXs.forEach(x=>{
    gardenFront.appendChild(plantHTML(x,delay,false));
    delay += 85;
  });

  setTimeout(()=>card.classList.add("show"), delay + 450);
}

start.addEventListener("click",()=>{
  intro.classList.add("hidden");
  scene.classList.remove("hidden");
  scene.setAttribute("aria-hidden","false");
  card.classList.remove("show");
  buildGarden();
});
</script>
</body>
</html>
