<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feliz Primavera 💛</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  font-family:Georgia,"Times New Roman",serif;
  background:#fff7cf;
  color:#654600;
}
button{font:inherit;border:0;background:none}
.screen{position:fixed;inset:0;width:100%;height:100%}
.hidden{display:none!important}

/* INICIO */
#intro{
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 50% 38%,#fffef7 0 24%,#fff4bd 56%,#f2dc81 100%);
}
#start{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:18px;
  cursor:pointer;
  animation:float 2.4s ease-in-out infinite;
}
.hero{
  font-size:116px;
  line-height:1;
  filter:drop-shadow(0 10px 16px rgba(90,60,0,.18));
}
.start-text{
  font-family:Arial,sans-serif;
  font-size:21px;
  font-weight:700;
  color:#795400;
  background:rgba(255,255,255,.55);
  padding:10px 18px;
  border-radius:999px;
  box-shadow:0 8px 24px rgba(90,60,0,.1);
}
@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-10px)}
}

/* ESCENA */
#scene{
  background:
    linear-gradient(
      #fffef9 0%,
      #fff2b7 48%,
      #d5ecac 48%,
      #9bc767 100%
    );
}
.sun{
  position:absolute;
  right:7%;
  top:6%;
  width:76px;
  height:76px;
  border-radius:50%;
  background:#ffd43b;
  box-shadow:
    0 0 0 14px rgba(255,212,59,.17),
    0 0 42px rgba(255,201,48,.42);
}
.cloud{
  position:absolute;
  background:rgba(255,255,255,.9);
  border-radius:999px;
  filter:drop-shadow(0 5px 8px rgba(80,70,0,.06));
}
.cloud:before,.cloud:after{
  content:"";
  position:absolute;
  background:inherit;
  border-radius:50%;
}
.c1{left:7%;top:9%;width:104px;height:31px}
.c1:before{width:44px;height:44px;left:15px;top:-18px}
.c1:after{width:58px;height:58px;left:45px;top:-26px}
.c2{left:47%;top:17%;width:116px;height:34px}
.c2:before{width:47px;height:47px;left:18px;top:-19px}
.c2:after{width:61px;height:61px;left:50px;top:-27px}

/* COLINAS */
.hill1{
  position:absolute;
  left:-16%;
  right:-16%;
  bottom:12%;
  height:43%;
  border-radius:50% 50% 0 0/100% 100% 0 0;
  background:#b9de88;
}
.hill2{
  position:absolute;
  left:-20%;
  right:-20%;
  bottom:-17%;
  height:46%;
  border-radius:50% 50% 0 0/100% 100% 0 0;
  background:#7fb650;
}

/* TARJETA */
.message-wrap{
  position:absolute;
  left:50%;
  top:19%;
  transform:translateX(-50%);
  width:min(92vw,680px);
  z-index:20;
  pointer-events:none;
}
.message{
  opacity:0;
  transform:translateY(14px) scale(.97);
  transition:opacity 1.1s ease,transform 1.1s ease;
  text-align:center;
  padding:17px 18px;
  background:rgba(255,255,255,.88);
  border:2px solid rgba(235,196,42,.45);
  border-radius:22px;
  box-shadow:0 14px 38px rgba(90,67,0,.13);
}
.message.show{
  opacity:1;
  transform:translateY(0) scale(1);
}
.message p{
  margin:0 0 9px;
  font-size:clamp(17px,4.2vw,25px);
  line-height:1.28;
}
.message h1{
  margin:0;
  font-size:clamp(25px,6vw,38px);
  color:#a06b00;
}
.message h2{
  margin:6px 0 0;
  font-size:clamp(20px,5vw,29px);
  color:#725100;
}

/* JARDÍN */
#garden{
  position:absolute;
  inset:0;
  z-index:10;
  pointer-events:none;
}
.plant{
  position:absolute;
  left:var(--x);
  bottom:var(--bottom);
  width:82px;
  height:210px;
  transform:translateX(-50%) scale(var(--scale));
  transform-origin:bottom center;
  opacity:0;
  animation:plantIn .55s ease-out var(--delay) forwards;
}
.stem{
  position:absolute;
  left:50%;
  bottom:0;
  width:8px;
  height:125px;
  border-radius:99px;
  background:linear-gradient(#4c841f,#79ad3a);
  transform:translateX(-50%) scaleY(0);
  transform-origin:bottom center;
  animation:stemGrow .55s ease-out calc(var(--delay) + 40ms) forwards;
}
.leaf{
  position:absolute;
  width:34px;
  height:18px;
  background:#5d9d2f;
  border-radius:100% 0 100% 0;
  opacity:0;
}
.leaf.l{
  left:9px;
  bottom:49px;
  animation:leafL .35s ease-out calc(var(--delay) + 210ms) forwards;
}
.leaf.r{
  right:9px;
  bottom:72px;
  animation:leafR .35s ease-out calc(var(--delay) + 270ms) forwards;
}
.head{
  position:absolute;
  left:50%;
  bottom:103px;
  transform:translateX(-50%) scale(.1) rotate(var(--rot));
  transform-origin:center;
  font-size:66px;
  line-height:1;
  opacity:0;
  filter:drop-shadow(0 6px 6px rgba(72,48,0,.13));
  animation:
    bloom .52s cubic-bezier(.2,.8,.2,1) calc(var(--delay) + 350ms) forwards,
    sway 4.8s ease-in-out calc(var(--delay) + 1s) infinite;
}

@keyframes plantIn{
  from{opacity:0}
  to{opacity:1}
}
@keyframes stemGrow{
  to{transform:translateX(-50%) scaleY(1)}
}
@keyframes leafL{
  from{opacity:0;transform:translateY(8px) rotate(-28deg)}
  to{opacity:1;transform:translateY(0) rotate(-28deg)}
}
@keyframes leafR{
  from{opacity:0;transform:translateY(8px) scaleX(-1) rotate(-28deg)}
  to{opacity:1;transform:translateY(0) scaleX(-1) rotate(-28deg)}
}
@keyframes bloom{
  0%{opacity:0;transform:translateX(-50%) scale(.1) rotate(-20deg)}
  70%{opacity:1;transform:translateX(-50%) scale(1.15) rotate(5deg)}
  100%{opacity:1;transform:translateX(-50%) scale(1) rotate(var(--rot))}
}
@keyframes sway{
  0%,100%{margin-left:0}
  50%{margin-left:7px}
}

/* PÉTALOS */
.petal{
  position:absolute;
  z-index:8;
  font-size:20px;
  opacity:.55;
  animation:petalFall linear infinite;
}
@keyframes petalFall{
  from{transform:translateY(-10vh) rotate(0deg)}
  to{transform:translateY(115vh) rotate(360deg)}
}

@media(max-width:520px){
  .hero{font-size:98px}
  .sun{width:64px;height:64px}
  .message-wrap{top:18%}
  .message{padding:14px 13px}
  .plant{
    width:76px;
    height:192px;
  }
  .stem{height:113px}
  .head{
    bottom:94px;
    font-size:60px;
  }
}
</style>
</head>

<body>

<section id="intro" class="screen">
  <button id="start" type="button">
    <div class="hero">🌻</div>
    <div class="start-text">Haz click aquí</div>
  </button>
</section>

<section id="scene" class="screen hidden" aria-hidden="true">
  <div class="sun"></div>
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>

  <div class="hill1"></div>
  <div class="hill2"></div>

  <div class="message-wrap">
    <div id="message" class="message">
      <p>Dicen que las flores amarillas son para prometer amor eterno, entonces recordé que yo quiero estar contigo siempre.</p>
      <h1>Te amo pollito💛</h1>
      <h2>Feliz Primavera</h2>
    </div>
  </div>

  <div id="garden"></div>
  <div id="petals"></div>
</section>

<script>
const intro = document.getElementById("intro");
const scene = document.getElementById("scene");
const start = document.getElementById("start");
const garden = document.getElementById("garden");
const petals = document.getElementById("petals");
const message = document.getElementById("message");

/* x, bottom, scale, rotation */
const flowers = [
  [7,  8, 1.18, -4],
  [18, 5, 1.35,  3],
  [31, 9, 1.22, -2],
  [44, 4, 1.42,  4],
  [58, 8, 1.28, -4],
  [72, 3, 1.36,  2],
  [86, 7, 1.24, -3],
  [96, 4, 1.33,  3],

  [12, 19, 1.02,  3],
  [25, 24, 1.18, -4],
  [39, 18, 1.12,  2],
  [52, 25, 1.23, -2],
  [66, 19, 1.10,  4],
  [80, 25, 1.20, -3],
  [93, 18, 1.08,  2],

  [5,  33, .92, -3],
  [20, 38, 1.02,  2],
  [35, 32, .96, -2],
  [50, 39, 1.08,  3],
  [65, 33, .95, -4],
  [80, 39, 1.04,  2],
  [95, 32, .92, -2]
];

function createFlower([x,bottom,scale,rot], i){
  const plant = document.createElement("div");
  plant.className = "plant";
  plant.style.setProperty("--x", x + "%");
  plant.style.setProperty("--bottom", bottom + "%");
  plant.style.setProperty("--scale", scale);
  plant.style.setProperty("--rot", rot + "deg");
  plant.style.setProperty("--delay", (i * 85) + "ms");

  plant.innerHTML = `
    <div class="stem"></div>
    <div class="leaf l"></div>
    <div class="leaf r"></div>
    <div class="head">🌻</div>
  `;

  garden.appendChild(plant);
}

function createPetals(){
  petals.innerHTML = "";
  const xs = [9,21,34,47,61,74,88];
  xs.forEach((x,i)=>{
    const p = document.createElement("div");
    p.className = "petal";
    p.textContent = "💛";
    p.style.left = x + "%";
    p.style.top = (-10 - i*8) + "%";
    p.style.animationDuration = (9 + i*1.4) + "s";
    p.style.animationDelay = (i*1.1) + "s";
    petals.appendChild(p);
  });
}

function buildGarden(){
  garden.innerHTML = "";
  message.classList.remove("show");

  flowers.forEach(createFlower);
  createPetals();

  setTimeout(()=>{
    message.classList.add("show");
  }, flowers.length * 85 + 500);
}

start.addEventListener("click",()=>{
  intro.classList.add("hidden");
  scene.classList.remove("hidden");
  scene.setAttribute("aria-hidden","false");
  buildGarden();
});
</script>
</body>
</html>
